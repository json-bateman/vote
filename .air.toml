root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
args_bin = []
entrypoint = "tmp/app"
cmd = "task sqlc && go tool templ generate && go build -o tmp/app ./cmd/app"
include_ext = ["go", "templ", "html", "css", "sql"]
# sqlcgen is regenerated by the build itself; watching it would retrigger builds
exclude_dir = ["tmp", "vendor", "testdata", "sql/sqlcgen"]
exclude_regex = ["_templ\\.go$"]
